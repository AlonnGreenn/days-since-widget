name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "newport-planner/**"
      - ".github/workflows/planner.yml"
      - "clock-widget/**"
      - ".github/workflows/clock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          else
            echo "::warning::No KEYSTORE_BASE64 secret; building with a throwaway debug key."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk days-since.apk

      - uses: actions/upload-artifact@v4
        with:
          name: days-since-apk
          path: days-since.apk

      # Stable phone-friendly link:
      # https://github.com/<owner>/<repo>/releases/latest/download/days-since.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Days Since 1.0.${{ github.run_number }}
          files: days-since.apk
          make_latest: true
