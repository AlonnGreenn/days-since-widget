name: Build MealCam APK

on:
  push:
    branches: [main]
    paths:
      - "mealcam/**"
      - ".github/workflows/mealcam.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: mealcam

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Key is a secret (MealCam has all-files access); without it the build uses a debug key.
      - name: Restore signing key
        env:
          KEY: ${{ secrets.MEALCAM_KEYSTORE_BASE64 }}
        run: if [ -n "$KEY" ]; then echo "$KEY" | base64 -d > app/mealcam.p12; fi

      - name: Unit tests
        run: gradle --no-daemon :app:testReleaseUnitTest 2>&1 | tee ../build.log

      - name: Build
        env:
          MEALCAM_KEYSTORE_PASSWORD: ${{ secrets.MEALCAM_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease 2>&1 | tee -a ../build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../mealcam.apk

      # Stable phone-friendly link:
      # https://github.com/<owner>/<repo>/releases/download/mealcam-latest/mealcam.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mealcam-latest
          name: MealCam (latest build)
          body: "Build ${{ github.run_number }} from ${{ github.sha }}"
          files: mealcam.apk
          make_latest: false

      # On failure, surface the compiler errors (annotations + a downloadable log)
      # so they can be read without logging in.
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Unresolved|Exception" -A2 ../build.log | head -c 60000 > ../errors.txt || true
          head -n 40 ../errors.txt | while IFS= read -r line; do echo "::error::$line"; done
      - name: Publish error log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mealcam-buildlog
          name: MealCam build log (last failure)
          body: "Failed build ${{ github.run_number }} from ${{ github.sha }}"
          files: |
            build.log
            errors.txt
          make_latest: false
