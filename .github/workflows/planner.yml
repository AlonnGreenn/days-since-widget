name: Build Planner APK

on:
  push:
    branches: [main]
    paths:
      - "newport-planner/**"
      - ".github/workflows/planner.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash
    working-directory: newport-planner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # The app can hand its own source to a future Claude chat (Settings → For future Claude).
      - name: Bundle source into the app
        run: |
          mkdir -p app/src/main/assets
          zip -qr app/src/main/assets/source.zip . -x "app/build/*" ".gradle/*" "build/*" "app/src/main/assets/*" "*.jks"

      - name: Unit tests
        run: gradle --no-daemon :app:testReleaseUnitTest 2>&1 | tee ../build.log

      - name: Build
        run: gradle --no-daemon :app:assembleRelease 2>&1 | tee -a ../build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../planner.apk

      # Stable phone-friendly link:
      # https://github.com/<owner>/<repo>/releases/download/planner-latest/planner.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: planner-latest
          name: Planner (latest build)
          body: "Build ${{ github.run_number }} from ${{ github.sha }}"
          files: planner.apk
          make_latest: false

      # On failure, surface the compiler errors (annotations + a downloadable log)
      # so they can be read without logging in.
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Unresolved|Exception" -A2 ../build.log | head -c 60000 > ../errors.txt || true
          head -n 40 ../errors.txt | while IFS= read -r line; do echo "::error::$line"; done
      - name: Publish error log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: planner-buildlog
          name: Planner build log (last failure)
          body: "Failed build ${{ github.run_number }} from ${{ github.sha }}"
          files: |
            build.log
            errors.txt
          make_latest: false
